<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSphere Solutions</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(rgba(2,12,27,0.9),rgba(11,28,44,0.9)), url('background.jpg') no-repeat center/cover fixed;color:#fff}
#loader{position:fixed;width:100%;height:100vh;background:#021421;display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column}
.loader-logo{width:100px;animation:spin 2s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
header{background:rgba(6,18,31,0.95);padding:20px;text-align:center}
.logo{width:90px;border-radius:12px;margin-bottom:10px;animation:float 3s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
nav{display:flex;justify-content:center;background:#09243a;padding:12px}
nav a{color:#fff;margin:0 20px;text-decoration:none}
.section{padding:50px;text-align:center}
</style>
<script>
window.onload=function(){document.getElementById('loader').style.display='none';}
</script>
</head>
<body>
<div id="loader"><img src="logo.png" class="loader-logo"><p>Loading...</p></div>
<header><img src="logo.png" class="logo"><h1>TechSphere Solutions</h1></header>
<nav><a href="#">Home</a><a href="#">Services</a><a href="#">Contact</a></nav>
<section class="section"><h2>Website Ready ✅</h2></section>
</body>
</html>
